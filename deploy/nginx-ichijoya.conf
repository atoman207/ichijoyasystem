# nginx の設定 (setup-server.sh が __DOMAIN__ を実際のドメインに置き換えて /etc/nginx/sites-available/ichijoya に置く)
# ドメインがまだないとき (IP アドレスで公開) は __DOMAIN__ を _ (どの名前でも受ける) にする
# HTTPS (443) の証明書の設定は certbot --nginx が追記する。HTTP (80) は certbot の後で HTTPS へ転送される

upstream ichijoya_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 書類取込の写真・PDF・CSV の取込 (アプリ側の上限は 4.5 MB)
    client_max_body_size 10m;

    # セキュリティのヘッダー (X-Content-Type-Options・X-Frame-Options・Referrer-Policy・Permissions-Policy) は
    # アプリ (next.config.ts) が付ける (IP アドレスで直接開いたときにも付くように。二重にしない)
    # HTTPS だけで接続させる (certbot で証明書を設定した後に有効。HTTP の応答では無視される)
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv;
    gzip_min_length 1024;

    # Next.js の静的ファイル (ファイル名にハッシュが付くので長くキャッシュする)
    location /_next/static/ {
        proxy_pass http://ichijoya_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://ichijoya_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        # AI の読み取り・会計データの出力は最大 60 秒ほどかかる
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
